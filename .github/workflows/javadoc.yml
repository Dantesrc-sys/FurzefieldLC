# Javadoc
# Generates the Javadoc HTML site and deploys it to GitHub Pages.
# Live URL after setup: https://<your-username>.github.io/FurzefieldLC/
#
# One-time setup required:
#   1. Go to your repository on GitHub
#   2. Settings > Pages > Source > select "GitHub Actions"
#   3. Save - that is all, this workflow handles the rest automatically

name: Javadoc

on:
  push:
    branches: [ "main" ]

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

# Sets permissions so the workflow can deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only allow one deployment at a time
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-docs:
    name: Generate Javadoc
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'oracle'
          cache: maven

      - name: Generate Javadoc
        run: mvn -B javadoc:javadoc --file pom.xml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/site/apidocs/

  deploy-docs:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-docs

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4